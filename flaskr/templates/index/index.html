{% extends 'base.html' %}

<!doctype html>
<title>{% block title %}Books{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}"/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='bootstrap.min.css') }}"
/>

{% block content %}
<html lang="en">
  <body>
    <div id="book_lookup_div">
      <form method="post" id="book_lookup_form">
        <input type="text" id="book_lookup" name="book_lookup" value="python programming" required>
        <button type="submit">Search</button>
      </form>
    </div>


    <div id="books_container">
    {% if books | length > 0 and image_urls | length > 0 %}
    {% for i in range(books | length) %}
      <div class="book_display">
        <img src="{{ image_urls[i] }}">
        <p class="book_description">{{ books[i].volumeInfo.description }}</p>
        <a href="{{ url_for('route.book_view', volume_id=books[i].id)}}" class="edit_btn">
          <img src="{{ url_for('static', filename='images/edit_pencil.png') }}" alt="Inspect"></img>
        </a>
      </div>
    {% endfor %}
    {% endif %}
    </div>
  </body>
</html>
{% endblock %}
