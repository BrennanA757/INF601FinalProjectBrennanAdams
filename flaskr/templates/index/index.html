{% extends 'base.html' %}

<!doctype html>
<title>{% block title %}Books{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}" />
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='bootstrap.min.css') }}"
/>

{% block content %}
<html lang="en">
  <body>
    <div id="books_container">
    {% if books | length > 0 and image_urls | length > 0 %}
    {% for i in range(books | length) %}
      <div class="book_display">
          <img src="{{ image_urls[i] }}">
        <p class="book_description">{{ books[i] }}</p>
      </div>
    {% endfor %}
    {% endif %}
    </div>
  </body>
</html>
{% endblock %}
