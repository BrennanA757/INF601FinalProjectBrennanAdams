{% extends 'base.html' %}

<!doctype html>
<title>{% block title %}Books{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}" />
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='bootstrap.min.css') }}"
/>

{% block content %}
<html lang="en">
  <body>
    <ul>
    {% if books | length > 0 and image_urls | length > 0 %}
    {% for i in range(books | length) %}
        <li>
            <p>{{books[i]}}</p>
            <img src="{{ image_urls[i] }}">
        </li>
    {% endfor %}
    {% endif %}
  </ul>
  </body>
</html>
{% endblock %}
